name: Deploy web to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-web
  cancel-in-progress: true

env:
  PROJECT_NAME: spliit
  WRANGLER: wrangler@4.20.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿을 저장소 Settings > Secrets and variables > Actions 에 추가하세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 처음 실행할 때 Pages 프로젝트가 없으면 만든다 (이미 있으면 무시).
      - name: Create Pages project if missing
        run: npx --yes "$WRANGLER" pages project create "$PROJECT_NAME" --production-branch main || true

      # web/ 폴더를 빌드 없이 그대로 배포한다.
      - name: Deploy web/
        run: npx --yes "$WRANGLER" pages deploy web --project-name "$PROJECT_NAME" --branch "${{ github.ref_name }}" --commit-dirty=true
